name: 🐞 Error
description: Algo no funciona como debería
title: "[Bug] "
labels: ["tipo: bug"]
body:
  - type: input
    id: modulo
    attributes:
      label: Módulo
      placeholder: Respaldos
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      value: |
        1. 
        2. 
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué se esperaba y qué pasó
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Mensaje de error (ORA-xxxxx completo) o captura
      render: text
